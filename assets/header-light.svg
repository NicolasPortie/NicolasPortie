<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Nicolas Portie, software engineer</title>
  <desc id="description">Composição abstrata que conecta domínio, API, dados e interface web.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9FAFF"/>
      <stop offset="0.55" stop-color="#F4F6FF"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="90" y1="80" x2="1080" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7048E8"/>
      <stop offset="0.5" stop-color="#3F6FEB"/>
      <stop offset="1" stop-color="#087EA4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(985 80) rotate(145) scale(370 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7185FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7185FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#526287" stroke-opacity="0.1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6A76A0" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <path d="M0 316C238 279 350 343 565 314C810 281 985 192 1200 225V360H0Z" fill="#6D5EF7" fill-opacity="0.05"/>

  <g filter="url(#shadow)">
    <rect x="64" y="54" width="526" height="252" rx="22" fill="#FFFFFF" fill-opacity="0.94" stroke="#67769F" stroke-opacity="0.2"/>
    <circle cx="91" cy="79" r="4" fill="#E85D6A"/>
    <circle cx="107" cy="79" r="4" fill="#D7A928"/>
    <circle cx="123" cy="79" r="4" fill="#21A875"/>
    <text x="546" y="84" text-anchor="end" fill="#66718D" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="2">NICOLAS.PORTIE</text>

    <rect x="94" y="111" width="52" height="52" rx="14" fill="url(#accent)"/>
    <text x="120" y="145" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">NP</text>
    <text x="94" y="211" fill="#11182A" font-family="Segoe UI, Arial, sans-serif" font-size="55" font-weight="700" letter-spacing="-2">software</text>
    <text x="94" y="266" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="55" font-weight="700" letter-spacing="-2">engineer.</text>
    <text x="425" y="258" fill="#68738E" font-family="Consolas, monospace" font-size="13">C# / .NET</text>
    <text x="425" y="280" fill="#68738E" font-family="Consolas, monospace" font-size="13">REACT / TS</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M722 180H790M938 180H1000M864 139V102M864 221V258" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="705" cy="180" r="5" fill="#7048E8"/>
    <circle cx="1017" cy="180" r="5" fill="#087EA4"/>
    <circle cx="864" cy="85" r="5" fill="#3F6FEB"/>
    <circle cx="864" cy="275" r="5" fill="#168AAD"/>

    <rect x="790" y="139" width="148" height="82" rx="18" fill="#FFFFFF" stroke="#6475A0" stroke-opacity="0.38"/>
    <text x="864" y="175" text-anchor="middle" fill="#17213A" font-size="17" font-weight="600">DOMAIN</text>
    <text x="864" y="197" text-anchor="middle" fill="#6B7691" font-family="Consolas, monospace" font-size="11">business rules</text>

    <rect x="623" y="146" width="99" height="68" rx="16" fill="#FFFFFF" stroke="#7048E8" stroke-opacity="0.55"/>
    <text x="672" y="185" text-anchor="middle" fill="#5333B5" font-size="14" font-weight="600">API</text>

    <rect x="1000" y="146" width="112" height="68" rx="16" fill="#FFFFFF" stroke="#087EA4" stroke-opacity="0.55"/>
    <text x="1056" y="185" text-anchor="middle" fill="#076785" font-size="14" font-weight="600">DATA</text>

    <rect x="806" y="49" width="116" height="53" rx="14" fill="#FFFFFF" stroke="#3F6FEB" stroke-opacity="0.55"/>
    <text x="864" y="81" text-anchor="middle" fill="#3158B6" font-size="13" font-weight="600">WEB</text>

    <rect x="801" y="258" width="126" height="53" rx="14" fill="#FFFFFF" stroke="#168AAD" stroke-opacity="0.55"/>
    <text x="864" y="290" text-anchor="middle" fill="#0C718F" font-size="13" font-weight="600">INTEGRATIONS</text>
  </g>

  <rect x="64" y="326" width="1072" height="1" fill="url(#accent)" fill-opacity="0.35"/>
  <text x="64" y="346" fill="#67738F" font-family="Consolas, monospace" font-size="10" letter-spacing="1.5">BUSINESS SYSTEMS / WEB PRODUCTS / INTEGRATIONS</text>
  <text x="1136" y="346" text-anchor="end" fill="#67738F" font-family="Consolas, monospace" font-size="10" letter-spacing="1.5">PENÁPOLIS · BR</text>
</svg>
